quarkus.application.name=fiap-auto-repair-shop

# Banco de dados
# Em desenvolvimento e testes o Quarkus Dev Services sobe um PostgreSQL em container.
# Fora desses perfis, a conexão vem obrigatoriamente das variáveis de ambiente.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# O esquema é versionado pelo Flyway; o Hibernate não cria nem altera tabelas.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Documentação da API
quarkus.smallrye-openapi.info-title=API da Oficina Mecânica
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=API do sistema integrado de atendimento e execução de serviços da oficina: ordens de serviço, clientes, veículos, serviços, peças e insumos.
quarkus.smallrye-openapi.info-contact-name=George José Borges Barboza
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=API da Oficina Mecânica

