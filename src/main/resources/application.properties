quarkus.application.name=fiap-auto-repair-shop

# Banco de dados
# Em desenvolvimento e testes o Quarkus Dev Services sobe um PostgreSQL em container.
# Fora desses perfis, a conexão vem obrigatoriamente das variáveis de ambiente.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# O esquema é versionado pelo Flyway; o Hibernate não cria nem altera tabelas.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Documentação da API
quarkus.smallrye-openapi.info-title=API da Oficina Mecânica
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=API do sistema integrado de atendimento e execução de serviços da oficina: ordens de serviço, clientes, veículos, serviços, peças e insumos.
quarkus.smallrye-openapi.info-contact-name=George José Borges Barboza
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=API da Oficina Mecânica


# Segurança
# O token é emitido pela própria aplicação e assinado com RSA (RS256).
# Em desenvolvimento e testes o Quarkus gera o par de chaves automaticamente;
# fora desses perfis as chaves são lidas dos arquivos indicados pelas variáveis de ambiente.
mp.jwt.verify.issuer=fiap-auto-repair-shop
smallrye.jwt.new-token.issuer=fiap-auto-repair-shop
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# As rotas administrativas exigem o papel ADMIN. A verificação ocorre na camada REST
# para que as falhas cheguem aos mapeadores de exceção e sejam respondidas como Problem Details.
quarkus.http.auth.proactive=false
quarkus.http.auth.policy.admin-role.roles-allowed=ADMIN
quarkus.http.auth.permission.admin.paths=/api/admin/*
quarkus.http.auth.permission.admin.policy=admin-role
quarkus.http.auth.permission.admin.applies-to=JAXRS

quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=Token obtido em POST /api/auth/login

# Usuário administrativo criado na inicialização se ainda não existir.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
%dev.app.admin.username=admin
%dev.app.admin.password=admin123
%test.app.admin.username=admin
%test.app.admin.password=admin123

# E-mail do orçamento
# Em desenvolvimento e testes o envio é simulado (mock); fora desses perfis usa o servidor SMTP configurado.
quarkus.mailer.from=Oficina Mecânica <oficina@fiap-auto-repair-shop.local>
%prod.quarkus.mailer.host=${MAILER_HOST}
%prod.quarkus.mailer.port=${MAILER_PORT}
%prod.quarkus.mailer.mock=false
